name: Lint

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint.yml
          # Exclut les templates Jinja2 (.yaml.j2) — syntaxe non-YAML valide
          file_or_dir: >
            ansible/
            k8s/

  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned ensemble compatible — ansible-core 2.19 casse ansible-lint v24
      - name: Install ansible-lint
        run: pip install "ansible-core==2.17.7" "ansible-lint==24.12.2"

      # community.general et ansible.posix sont requis pour syntax-check
      - name: Install Ansible collections
        run: ansible-galaxy collection install community.general ansible.posix

      - name: Run ansible-lint
        run: ansible-lint ansible/

  kubeval:
    name: K8s Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeval
        run: |
          wget -q https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
          tar xf kubeval-linux-amd64.tar.gz
          sudo mv kubeval /usr/local/bin/

      - name: Validate K8s manifests
        # --ignore-missing-schemas : ignore les CRDs custom (Traefik IngressRoute, Middleware...)
        # Les .yaml.j2 sont exclus car ils contiennent du Jinja2 non-YAML
        run: |
          find k8s/ -name "*.yaml" | xargs kubeval \
            --ignore-missing-schemas \
            --kubernetes-version 1.30.0
