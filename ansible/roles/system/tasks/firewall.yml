- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set default incoming policy to deny
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set default outgoing policy to allow
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow SSH
  community.general.ufw:
    rule: allow
    name: OpenSSH

- name: Allow HTTP (80)
  community.general.ufw:
    rule: allow
    port: '80'
    proto: tcp

- name: Allow HTTPS (443)
  community.general.ufw:
    rule: allow
    port: '443'
    proto: tcp

- name: Allow Minecraft TCP (25565)
  community.general.ufw:
    rule: allow
    port: '25565'
    proto: tcp

# --- Règles multi-nœuds K3s (conditionnelles selon le groupe du nœud) ---

# Sur le master : le worker doit pouvoir s'enregistrer via l'API K3s.
- name: Allow K3s API from worker (TCP 6443)
  community.general.ufw:
    rule: allow
    port: '6443'
    proto: tcp
    src: "{{ hostvars[groups['k3s_worker'][0]]['ansible_host'] }}"
  when: "'k3s_worker' in groups and 'k3s_master' in group_names"

# Sur le worker : Flannel encapsule le trafic pod dans VXLAN (UDP 8472).
# Sans cette règle, les pods sur master et worker ne peuvent pas se parler.
- name: Allow Flannel VXLAN from master (UDP 8472)
  community.general.ufw:
    rule: allow
    port: '8472'
    proto: udp
    src: "{{ hostvars[groups['k3s_master'][0]]['ansible_host'] }}"
  when: "'k3s_worker' in group_names"

# Sur le worker : le master l'utilise pour kubectl exec, logs, port-forward.
- name: Allow kubelet API from master (TCP 10250)
  community.general.ufw:
    rule: allow
    port: '10250'
    proto: tcp
    src: "{{ hostvars[groups['k3s_master'][0]]['ansible_host'] }}"
  when: "'k3s_worker' in group_names"

- name: Allow Flannel/K3s pod traffic (DEFAULT_FORWARD_POLICY)
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: '^DEFAULT_FORWARD_POLICY='
    line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'

- name: Enable UFW
  community.general.ufw:
    state: enabled
